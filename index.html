<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pingisturnering</title>
  
  <!-- PWA & Ikoner -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png+xml" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#2c3e50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #2c3e50;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Byt ut nedanstående URL mot din riktiga Apps Script Web App URL -->
  <iframe src="https://script.google.com/macros/s/AKfycbzMkylmkBC19T8fq4eed0c2QPv2dYZ2KA6ZEq6silJ--mPefIehQchIIFARgVW-y0Xi/exec?embedded=true" allow="microphone; camera; autoplay;"></iframe>

  <script>
    // Registrera Service Worker för PWA-stöd
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  </script>
</body>
</html>
